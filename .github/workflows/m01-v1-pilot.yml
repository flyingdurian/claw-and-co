name: Claw & Co. | M01 V1 Common Prefix Pilot
on:
  push:
    branches: [ 'r5/m01-v1-common-prefix-pilot' ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m01-v1-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot software rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb ffmpeg libgl1 libgl1-mesa-dri libglx-mesa0 libx11-6 libxext6 libxcursor1 libxi6 libxrandr2 libxinerama1 libasound2t64 mesa-vulkan-drivers unzip python3-pil
      - name: Download official Godot 4.7.2
        run: python3 ci/fetch_godot.py
      - name: Run full project regressions and Godot import
        run: bash ci/run_suites.sh
      - name: Run original accepted M01 mechanical rig tests
        run: |
          mkdir -p ci/output/m01v1
          bash ci/run_m01_v31.sh
      - name: Run approved PR3 prize presentation and six V1 pilot fixtures
        run: |
          ci/bin/godot --headless --path . --script res://scripts/tests/RunM01AuthoredPrizeTests.gd | tee ci/output/m01v1/pr3_tests.log
          ci/bin/godot --headless --path . --script res://scripts/tests/RunM01VariationPilotTests.gd | tee ci/output/m01v1/v1_variation_tests.log
          grep -E 'M01_V1_ASSERTIONS=.*FAILED=0' ci/output/m01v1/v1_variation_tests.log
      - name: Capture 18 genuine Godot 1280x720 M01 animation states
        run: |
          mkdir -p ci/output/m01v1/screenshots
          LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe timeout 190s xvfb-run -a -s '-screen 0 1280x720x24' ci/bin/godot --path . --rendering-method gl_compatibility --resolution 1280x720 --audio-driver Dummy --script res://ci/CaptureM01V1VariationPilot.gd | tee ci/output/m01v1/capture.log
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          p=Path('ci/output/m01v1/screenshots')
          files=sorted(p.glob('*.png'))
          assert len(files)==18,len(files)
          out=Path('ci/output/m01v1')
          for f in files:
              with Image.open(f) as im: assert im.size==(1280,720),f
          for j,tick in enumerate([163,205,229]):
              target=Image.new('RGB',(1280*3,720*2))
              for i,vid in enumerate(['W1','W2','W3','M1','M2','M3']):
                  with Image.open(p/(vid+f'_{tick:03}.png')) as im:
                      target.paste(im.convert('RGB'),((i%3)*1280,(i//3)*720))
              target.save(out/(f'v1_six_variants_tick_{tick}.jpg'),quality=88)
          print('M01_V1_CAPTURE_PROOF=18 REAL 1280x720 GODOT IMAGES')
          PY
      - name: Upload V1 pilot screenshots and all test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m01-v1-six-variant-proof
          path: |
            ci/output/m01v1
            ci/output/m01v31
            ci/output/logs
          retention-days: 14
