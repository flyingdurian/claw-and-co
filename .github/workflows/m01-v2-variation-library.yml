name: Claw & Co. | M01 V2 Complete Sequence Library
on:
  push:
    branches: [ 'r5/m01-v2-complete-variation-library' ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m01-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 46
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot software-rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb ffmpeg libgl1 libgl1-mesa-dri libglx-mesa0 libx11-6 libxext6 libxcursor1 libxi6 libxrandr2 libxinerama1 libasound2t64 mesa-vulkan-drivers unzip python3-pil
      - name: Download official Godot 4.7.2
        run: python3 ci/fetch_godot.py
      - name: Run full project regressions
        run: bash ci/run_suites.sh
      - name: Verify original accepted V3.1 gantry and record motion
        run: bash ci/run_m01_v31.sh
      - name: Verify V1 and V2 regression fixtures, ten sequences, no early reveal
        run: |
          mkdir -p ci/output/m01v2
          set -o pipefail
          ci/bin/godot --headless --path . --script res://scripts/tests/RunM01AuthoredPrizeTests.gd | tee ci/output/m01v2/accepted_prize_tests.log
          ci/bin/godot --headless --path . --script res://scripts/tests/RunM01VariationPilotTests.gd | tee ci/output/m01v2/v1_compatibility.log
          ci/bin/godot --headless --path . --script res://scripts/tests/RunM01V2VariationTests.gd | tee ci/output/m01v2/v2_variation_tests.log
          grep -E 'M01_V1_ASSERTIONS=.*FAILED=0' ci/output/m01v2/v1_compatibility.log
          grep -E 'M01_V2_ASSERTIONS=.*FAILED=0' ci/output/m01v2/v2_variation_tests.log
      - name: Capture 42 genuine Godot 1280x720 V2 frames
        run: |
          mkdir -p ci/output/m01v2/screenshots
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe timeout 220s xvfb-run -a -s '-screen 0 1280x720x24' ci/bin/godot --path . --rendering-method gl_compatibility --resolution 1280x720 --audio-driver Dummy --script res://ci/CaptureM01V2Variations.gd | tee ci/output/m01v2/capture.log
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          p=Path('ci/output/m01v2/screenshots')
          files=list(p.glob('*.png'))
          assert len(files)==42,len(files)
          out=Path('ci/output/m01v2')
          for f in files:
              with Image.open(f) as im: assert im.size==(1280,720),f
          ids=['W1','W2','W3','W4','W5','M1','M2','M3','M4','M5']
          for tick in [163,205,228,238]:
              canvas=Image.new('RGB',(1280*5,720*2))
              for i,vid in enumerate(ids):
                  with Image.open(p/(vid+f'_{tick:03}.png')) as im:
                      canvas.paste(im.convert('RGB'),((i%5)*1280,(i//5)*720))
              canvas.save(out/(f'v2_all_ten_tick_{tick}.jpg'),quality=90)
          print('M01_V2_CAPTURE_PROOF=42 REAL GODOT IMAGES')
          PY
      - name: Upload real V2 capture sheets, engine proof and regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m01-v2-ten-variation-proof
          path: |
            ci/output/m01v2
            ci/output/m01v31
            ci/output/logs
          retention-days: 14
