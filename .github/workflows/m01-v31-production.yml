name: Claw & Co. | Approved M01 V3.1 Production Proof
on:
  push:
    branches: [ 'integration/m01-v31-approved-gantry' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m01-v31:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot runtime dependencies and image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb ffmpeg libgl1 libgl1-mesa-dri libglx-mesa0 libx11-6 libxext6 libxcursor1 libxi6 libxrandr2 libxinerama1 libasound2t64 mesa-vulkan-drivers python3-pil
      - name: Verify approved V3.1 production assets are versioned
        run: |
          test -s art/m01_v31/M01Cabinet.png
          test -s art/m01_v31/cross_bridge.png
          test -s art/m01_v31/cable_chain.png
          test -s data/r5/M01V31Calibration.json
          python3 - <<'PY'
          import json
          p=json.load(open('data/r5/M01V31Calibration.json'))
          assert p['version']==3.1 and p['roof_pitch_degrees']==5.4
          assert p['bridge']['visual_scale_percent']==105 and p['trolley_scale_percent']==80
          print('APPROVED_V31_ASSETS_VERSIONED')
          PY
      - name: Download exact Godot 4.7.2
        run: python3 ci/fetch_godot.py
      - name: Run isolated production V3.1 mechanical integration and real engine video
        run: bash ci/run_m01_v31.sh
      - name: Regression of accepted simulation, Gate E and production presentation
        run: bash ci/run_suites.sh
      - name: Retain test logs and original engine captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m01-v31-production-proof
          path: |
            ci/output/m01v31
            ci/output/logs
          if-no-files-found: warn
          retention-days: 14
